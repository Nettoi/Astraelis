name: Déploiement

# Production à chaque fusion sur main ; version de prévisualisation pour chaque PR.
# Ne fait rien tant que les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID ne sont pas définis.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploiement-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Les PR venant d'un fork n'ont pas accès aux secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérifier la présence des secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets Cloudflare absents : déploiement ignoré (voir README, section Déploiement)."
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ok == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.secrets.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile && pnpm --filter @astraelis/client build
      - name: Production
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'push'
        run: pnpm --filter @astraelis/edge exec wrangler deploy
      - name: Prévisualisation de la PR
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'pull_request'
        run: |
          pnpm --filter @astraelis/edge exec wrangler versions upload \
            --preview-alias "pr-${{ github.event.pull_request.number }}" | tee sortie.txt
          URL=$(grep -oE 'https://[^ ]+\.workers\.dev' sortie.txt | tail -1)
          echo "Prévisualisation : $URL" >> "$GITHUB_STEP_SUMMARY"
